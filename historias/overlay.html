<style>

  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body { font-family: 'Poppins', 'Noto Color Emoji', sans-serif; color: #fff; position: relative; }

  .brillo { width: 70px; height: 70px; opacity: 0; }
  .sticker.fuego { background: linear-gradient(135deg, #FFD34D, #FF7A00 50%, #FF2E1F); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }

  .sticker.arena { background: #E8D3A8; color: #2B2A27; border-color: #fff; }

  @keyframes buscar { 0% { transform: translate(-260px, -200px) } 30% { transform: translate(220px, -60px) } 60% { transform: translate(-120px, 160px) } 100% { transform: none } }
  @keyframes borrar { to { transform: scaleX(0) } }
  @keyframes pintar { to { clip-path: inset(0 0 0 0) } }
  @keyframes salpicar { 0% { opacity: 0; transform: scale(0) rotate(var(--r)) } 70% { opacity: 1; transform: scale(1.15) rotate(var(--r)) } 100% { opacity: 1; transform: scale(1) rotate(var(--r)) } }
  @keyframes llenarCol { to { height: 100% } }
  @keyframes apretar { 0%,100% { transform: none } 50% { transform: scale(.88) rotate(-6deg) } }
  @keyframes abrirSolapa { to { transform: rotateX(180deg); } }
  @keyframes sacarCarta { 0% { opacity: 0; transform: translateY(80px) scale(.55) } 25% { opacity: 1 } 100% { opacity: 1; transform: translateY(-680px) scale(1) } }
  @keyframes caerSobre { from { opacity: 0; transform: translateY(-900px) rotate(-8deg) } to { opacity: 1; transform: none } }
  @keyframes saltarSello { 0% { transform: none } 40% { transform: scale(1.3) } 100% { opacity: 0; transform: translate(-260px, -400px) scale(.5) rotate(-60deg) } }
  @keyframes flotarCor { 0% { opacity: 0; transform: translateY(0) scale(.6) } 20% { opacity: 1 } 100% { opacity: 0; transform: translateY(-420px) scale(1.1) } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }
  @keyframes subir { from { opacity: 0; transform: translateY(60px) } to { opacity: 1; transform: none } }
  @keyframes subirCard { from { opacity: 0; transform: translateY(380px) } to { opacity: 1; transform: none } }
  @keyframes bajarCard { from { opacity: 0; transform: translateY(-380px) } to { opacity: 1; transform: none } }
  @keyframes golpe { from { opacity: 0; transform: scale(2.2) } to { opacity: 1; transform: scale(1) } }
  @keyframes entrarIzq { from { opacity: 0; transform: translateX(-600px) } to { opacity: 1; transform: none } }
  @keyframes salirIzq { from { opacity: 1; transform: none } to { opacity: 0; transform: translateX(-600px) } }
  @keyframes pop { from { opacity: 0; transform: scale(0) rotate(-40deg) } to { opacity: 1; transform: scale(1) rotate(0) } }
  @keyframes bamboleo { 0%,100% { transform: rotate(0) scale(1) } 50% { transform: rotate(6deg) scale(1.06) } }
  @keyframes latido { 0%,100% { transform: scale(1) } 50% { transform: scale(1.07) } }
  @keyframes rebote { 0%,100% { transform: translateY(0) } 50% { transform: translateY(28px) } }
</style>
</head>
<body>
<script>
  // Datos del producto: los inyecta render.js (window.DATA). Este es un ejemplo para abrir el HTML directo.
  const D = window.DATA || {
    duracionClip: 8.8,
    segmentos: [{ desde: 0.4, hasta: 8.8, pos: 'abajo', nombre: 'POLERA', acento: 'PUNTO',
      chips: ['HOMBRE', 'TALLA S'], precio: '$18.000', frases: ['Tejido de punto', '100% original'] }],
    cierre: { titulo: '¿LA QUIERES?', nombre: 'POLERA PUNTO', precio: '$18.000',
      texto: 'Escríbenos por DM y te la reservamos', boton: 'RESPONDE "PUNTO"' }
  };

  // Colores opcionales por historia (tema)
  Object.entries(D.tema || {}).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));

  const EASE_IN = 'cubic-bezier(.2,1.25,.4,1)', EASE_POP = 'cubic-bezier(.2,1.8,.4,1)';
  const el = (cls, html, parent = document.body) => {
    const e = document.createElement('div'); e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e;
  };
  const anim = (e, ...a) => { e.style.animation = a.join(', '); };
  const s = n => `${n.toFixed(2)}s`;

  const check = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b1223" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const pts = [];
  for (let i = 0; i < 44; i++) {
    const r = i % 2 ? 128 : 160, a = (Math.PI * i) / 22 - Math.PI / 2;
    pts.push(`${(165 + r * Math.cos(a)).toFixed(1)},${(165 + r * Math.sin(a)).toFixed(1)}`);
  }
  const estrella = `<svg viewBox="0 0 330 330" width="220" height="220">
    <polygon points="${pts.join(' ')}" style="fill:var(--sombraPrecio, var(--rosa))" transform="translate(8 8)"/>
    <polygon points="${pts.join(' ')}" style="fill:var(--amarillo)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>`;

  const ruletas = [];
  window.onFrame = t => ruletas.forEach(f => f(t));

  // ---------- Variante "pase de socio" con timbre de precio ----------
  function pase(seg) {
    const t0 = seg.desde, t1 = seg.hasta, top = seg.top || 1410;
    const g = el('abs grad abajo'); anim(g, `fadeIn .5s ease ${s(t0)} both`);
    const c = el('abs pase', `
      <div class="head"><div class="tg"></div><div class="nro">${seg.numero || 'Nº 0001'}</div></div>
      <img class="logo" src="assets/logo.png" alt="">
      <div class="tit">${seg.titulo || 'PASE DE SOCIO'}</div>
      <div class="nombre">${seg.nombre} <b>${seg.acento}</b></div>
      <div class="chips">${seg.chips.map(x => `<span class="chip">${x}</span>`).join('')}</div>`);
    c.style.top = top + 'px';
    anim(c, `subirCard .6s ${EASE_IN} ${s(t0)} both`);
    const tags = [].concat(seg.tag || 'TIENDA VIRTUAL 100% ORIGINAL'), paso = (t1 - t0) / tags.length;
    tags.forEach((txt, i) => {
      const sp = document.createElement('span'); sp.textContent = txt; c.querySelector('.tg').appendChild(sp);
      const a = [`tagIn .35s ease-out ${s(t0 + (i ? i * paso : 0.3))} both`];
      if (i < tags.length - 1) a.push(`tagOut .3s ease-in ${s(t0 + (i + 1) * paso - 0.3)} forwards`);
      anim(sp, ...a);
    });
    if (seg.precio) {
      const se = el('abs sello', `<div><small>${seg.selloTexto || 'APROBADO'}</small><strong>${seg.precio}</strong><small>SOLO</small></div>`);
      Object.assign(se.style, { left: '790px', top: top - 200 + 'px' });
      anim(se, `timbrazo .45s cubic-bezier(.3,1.4,.5,1) ${s(seg.selloEn ?? t0 + 0.8)} both`);
    }
  }

  // ---------- Etiqueta de precio colgante ----------
  if (D.colgante) {
    const K = D.colgante;
    const c = el('abs colgante', `<div class="hilo"></div><div class="papel"><div class="ojal"></div>
      <img class="logo" src="assets/logo.png" alt="">
      <div class="n1">${K.nombre}</div><div class="n2">${K.acento}</div>
      <div class="ch">${K.chips.join(' · ')}</div>
      <div class="pr">${K.precio}</div><div class="tg"></div></div>`);
    Object.assign(c.style, { left: K.x + 'px', top: K.y + 'px' });
    anim(c, `colgar 1.8s ease-out ${s(K.desde)} both`, `mecerse 2.4s ease-in-out ${s(K.desde + 1.8)} infinite`);
    const tags = [].concat(K.tag), paso = (K.hasta - K.desde - 1) / tags.length;
    tags.forEach((txt, i) => {
      const sp = document.createElement('span'); sp.textContent = txt; c.querySelector('.tg').appendChild(sp);
      const t = K.desde + 1 + i * paso, a = [`tagIn .35s ease-out ${s(t)} both`];
      if (i < tags.length - 1) a.push(`tagOut .3s ease-in ${s(t + paso - 0.3)} forwards`);
      anim(sp, ...a);
    });
  }

  // ---------- Definición de diccionario ----------
  (D.diccionario ? [D.diccionario] : []).forEach(Q => {
    const d = el('abs dicc', `<div class="pal">${Q.palabra}<i>${Q.fonetica || ''}</i></div>
      <div class="def"><b>1.</b>${Q.definicion}</div><div class="def2">${Q.chileno}</div>`);
    Object.assign(d.style, { left: (1080 - 860) / 2 + 'px', top: Q.y + 'px', transform: 'rotate(-1.5deg)' });
    anim(d, `subir .5s ${EASE_IN} ${s(Q.desde)} both`, `fadeOut .35s ease ${s(Q.hasta - 0.35)} forwards`);
    anim(d.querySelector('.def2'), `golpe .45s cubic-bezier(.2,1.5,.4,1) ${s(Q.desde + 1.2)} both`);
  });

  // ---------- Pluma flotando ----------
  if (D.pluma) {
    const P = D.pluma;
    const pl = el('abs pluma', `<svg viewBox="0 0 120 300"><path d="M60 290 C58 220 56 150 62 10" stroke="#8a7650" stroke-width="5" fill="none"/>
      <path d="M62 14 C20 60 10 140 30 220 C40 200 52 196 58 230 C60 160 62 90 62 14Z" fill="#fff" opacity=".95"/>
      <path d="M62 14 C104 60 112 140 92 220 C82 200 70 196 64 230 C62 160 62 90 62 14Z" fill="#F3E7CC"/></svg>`);
    Object.assign(pl.style, { left: P.x + 'px', top: P.y + 'px', filter: 'drop-shadow(0 10px 14px rgba(0,0,0,.35))' });
    anim(pl, `flotar ${P.dur}s ease-in-out ${s(P.desde)} both`, `fadeOut .4s ease ${s(P.desde + P.dur)} forwards`);
  }

  // ---------- Chat estilo WhatsApp ----------
  if (D.chat) {
    const H = D.chat;
    const ch = el('abs chat', `<div class="cab"><img src="assets/logo.png" alt=""><div><b>${H.nombre}</b><small>${H.estado}</small></div></div>`);
    ch.style.top = H.y + 'px';
    anim(ch.querySelector('.cab'), `bajar .5s ${EASE_IN} ${s(H.desde)} both`);
    H.mensajes.forEach(m => {
      const sl = el(`slot ${m.de === 'yo' ? 'yo' : 'ella'}`, `<div class="msg">${m.texto}<span class="h">${m.hora || ''}</span></div>`, ch);
      if (m.escribiendo) {
        const e = el('esc', '<i></i><i></i><i></i>', sl);
        anim(e, `fadeIn .15s ease ${s(m.t - m.escribiendo)} both`, `fadeOut .1s ease ${s(m.t)} forwards`);
        e.querySelectorAll('i').forEach((d, k) => anim(d, `puntitos .6s ease-in-out ${s(m.t - m.escribiendo + k * 0.15)} infinite`));
      }
      anim(sl.querySelector('.msg'), `burbuja .3s cubic-bezier(.2,1.4,.4,1) ${s(m.t)} both`);
    });
  }

  // ---------- Amanecer con saludo ----------
  if (D.amanecer) {
    const A = D.amanecer;
    const rayos = Array.from({ length: 16 }, (_, i) =>
      `<rect x="205" y="0" width="10" height="70" rx="5" fill="#FFF1B8" transform="rotate(${i * 22.5} 210 210)"/>`).join('');
    const a = el('abs amanecer', `<div class="sol"><svg viewBox="0 0 420 420">${rayos}</svg><div class="disco"></div></div>
      <div class="hola">${A.titulo}</div><div class="sub">${A.texto}</div><div class="firma">${A.firma || ''}</div>`);
    anim(a, `fadeIn .4s ease ${s(A.desde)} both`, `telon .6s cubic-bezier(.6,0,.4,1) ${s(A.hasta - 0.6)} forwards`);
    anim(a.querySelector('.sol'), `salir 1.4s cubic-bezier(.2,.9,.3,1) ${s(A.desde + 0.1)} both`);
    anim(a.querySelector('.sol svg'), `girar 8s linear ${s(A.desde)} infinite`);
    anim(a.querySelector('.hola'), `golpe .6s cubic-bezier(.2,1.4,.4,1) ${s(A.desde + 0.4)} both`);
    anim(a.querySelector('.sub'), `subir .5s ease-out ${s(A.desde + 1.0)} both`);
    anim(a.querySelector('.firma'), `fadeIn .4s ease ${s(A.desde + 1.4)} both`);
  }

  // ---------- Libreta de pendientes (tarjeta de producto) ----------
  if (D.libreta) {
    const B = D.libreta;
    const wrap = el('abs');
    Object.assign(wrap.style, { left: B.x + 'px', top: B.y + 'px', transform: `rotate(${B.rot || -2}deg)` });
    const lb = el('libreta', `<div class="cinta">${B.cinta}</div><img class="logo" src="assets/logo.png" alt="">
      <h3>${B.titulo}</h3>${B.items.map(it => `<div class="it"><span class="box"><svg viewBox="0 0 66 66"><path d="M8 34 L26 52 L60 10"/></svg></span><span>${it.texto}</span></div>`).join('')}`);
    lb.style.position = 'relative'; wrap.appendChild(lb);
    anim(lb, `subir .6s ${EASE_IN} ${s(B.desde)} both`);
    lb.querySelectorAll('.it path').forEach((pa, i) => anim(pa, `dibujar .4s ease-out ${s(B.items[i].t)} forwards`));
  }

  // ---------- Cinta que corre ----------
  if (D.ticker) {
    const K = D.ticker;
    const t = el('abs ticker', `<div class="pista"><span>${K.texto}</span><span>${K.texto}</span><span>${K.texto}</span><span>${K.texto}</span></div>`);
    t.style.top = K.y + 'px'; t.style.transform = `rotate(${K.rot || 0}deg)`;
    anim(t, `fadeIn .4s ease ${s(K.desde)} both`);
    anim(t.querySelector('.pista'), `correr ${K.vuelta || 14}s linear ${s(K.desde)} infinite`);
  }

  // ---------- Insignia redonda con precio ----------
  if (D.insignia) {
    const N = D.insignia;
    const ins = el('abs insignia', `<svg class="anillo" viewBox="0 0 250 250"><defs><path id="circ" d="M125 125 m-108 0 a108 108 0 1 1 216 0 a108 108 0 1 1 -216 0"/></defs>
      <circle cx="125" cy="125" r="122" fill="#0A2540"/><text font-family="Poppins" font-weight="800" font-size="19" letter-spacing="3.2" fill="#fff">
      <textPath href="#circ">${N.anillo}</textPath></text></svg><div class="centro"><div><small>SOLO</small><strong>${N.precio}</strong></div></div>`);
    Object.assign(ins.style, { left: N.x + 'px', top: N.y + 'px' });
    anim(ins, `pop .6s ${EASE_POP} ${s(N.desde)} both`);
    anim(ins.querySelector('.anillo'), `girar 9s linear ${s(N.desde)} infinite`);
  }

  // ---------- Texto que se escribe solo ----------
  if (D.maquina) {
    const M = D.maquina, m = el('abs maquina');
    Object.assign(m.style, { left: M.x + 'px', top: M.y + 'px' });
    const cps = M.cps || 16;
    ruletas.push(t => {
      let html = '', ultimo = -1;
      M.lineas.forEach((ln, i) => {
        if (t < ln.t) return;
        const n = Math.min(ln.texto.length, Math.floor((t - ln.t) * cps));
        html += (html ? '<br>' : '') + `<span class="ln">${ln.texto.slice(0, n)}${'%CUR' + i}</span>`; ultimo = i;
      });
      const parpadea = Math.floor(t * 2.5) % 2 === 0;
      m.innerHTML = html.replace(/%CUR(\d+)/g, (_, k) => (+k === ultimo && parpadea ? '<span class="cur"></span>' : ''));
    });
  }

  // ---------- Modo cine: franjas, título y subtítulos ----------
  if (D.cine) {
    const Z = D.cine, fin = D.cierre ? `fadeOut .3s ease ${s(D.duracionClip - 0.3)} forwards` : null;
    const top = el('abs barra arriba', `<div class="in"><div class="marca"><img src="assets/logo.png" alt="">${Z.presenta}</div><div class="coleccion">${Z.coleccion}</div></div>`);
    const bot = el('abs barra abajo', `<div class="in"><div><div class="nom">${Z.nombre}</div><div class="det">${Z.detalle}</div></div><div class="pre">${Z.precio}</div></div>`);
    anim(top, `barraIn .7s cubic-bezier(.6,0,.2,1) ${s(Z.desde)} forwards`, ...(fin ? [fin] : []));
    anim(bot, `barraIn .7s cubic-bezier(.6,0,.2,1) ${s(Z.desde)} forwards`, ...(fin ? [fin] : []));
    anim(bot.querySelector('.pre'), `golpe .5s cubic-bezier(.2,1.5,.4,1) ${s(Z.precioEn)} both`);
    if (Z.titulo) {
      const ti = el('abs cine-titulo', `<div class="t">${Z.titulo.texto}</div><div class="s">${Z.titulo.sub}</div>`);
      anim(ti, `fadeIn .01s linear ${s(Z.titulo.desde)} both`, `fadeOut .5s ease ${s(Z.titulo.hasta - 0.5)} forwards`);
      anim(ti.querySelector('.t'), `espaciar 1s cubic-bezier(.2,.8,.2,1) ${s(Z.titulo.desde)} both`);
      anim(ti.querySelector('.s'), `fadeIn .6s ease ${s(Z.titulo.desde + 0.8)} both`);
    }
    (Z.subtitulos || []).forEach(u => {
      const st = el('abs subt', u.texto);
      anim(st, `fadeIn .2s ease ${s(u.desde)} both`, `fadeOut .2s ease ${s(u.hasta - 0.2)} forwards`);
    });
  }

  // ---------- Grafiti con chorreo ----------
  if (D.grafiti) {
    const G = D.grafiti, g = el('abs grafiti', `<span class="g">${G.texto}</span>`);
    g.style.top = G.y + 'px';
    if (G.color) g.style.setProperty('--g-color', G.color);
    anim(g, `spray .9s steps(14) ${s(G.desde)} both`);
    (G.gotas || [0.12, 0.35, 0.62, 0.86]).forEach((f, i) => {
      const d = el('gota', '', g.firstElementChild);
      d.style.left = (f * 100) + '%'; d.style.setProperty('--h', (40 + (i * 37) % 60) + 'px');
      anim(d, `chorrear 1.6s ease-out ${s(G.desde + 0.8 + i * 0.15)} forwards`);
    });
  }

  // ---------- Etiquetas de rotuladora ----------
  (D.dymos || []).forEach(dm => {
    const w = el('abs'); Object.assign(w.style, { left: dm.x + 'px', top: dm.y + 'px' });
    const k = el(`dymo ${dm.color || ''}`, dm.texto, w);
    k.style.setProperty('--r', (dm.rot || 0) + 'deg'); k.style.setProperty('--r0', ((dm.rot || 0) + 12) + 'deg');
    anim(k, `pegar .4s ease-out ${s(dm.desde)} both`);
  });

  // ---------- Sticker "Hola, mi precio es" ----------
  if (D.hello) {
    const H = D.hello, w = el('abs'); Object.assign(w.style, { left: H.x + 'px', top: H.y + 'px' });
    const k = el('hello', `<div class="h1">${H.titulo || 'HOLA'}</div><div class="h2">${H.sub || 'MI PRECIO ES'}</div><div class="h3">${H.precio}</div>`, w);
    k.style.setProperty('--r', (H.rot || 6) + 'deg'); k.style.setProperty('--r0', ((H.rot || 6) - 25) + 'deg');
    anim(k, `pegar .45s cubic-bezier(.3,1.4,.5,1) ${s(H.desde)} both`);
  }

  // ---------- Medidor de talla ----------
  if (D.medidor) {
    const M = D.medidor, n = M.tallas.length;
    const pos = t => `calc(40px + ${M.tallas.indexOf(t)} * (100% - 160px) / ${n - 1} + 40px)`;
    const m = el('abs medidor', `<div class="rot">${M.texto}</div><div class="riel">
      <svg class="flecha" viewBox="0 0 60 70"><path d="M30 68 L4 28 L18 28 L18 2 L42 2 L42 28 L56 28 Z" fill="#FF6A00" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg></div>
      <div class="marcas">${M.tallas.map(t => `<span>${t}</span>`).join('')}</div>`);
    m.style.top = M.y + 'px';
    const fl = m.querySelector('.flecha');
    fl.style.setProperty('--de', pos(M.desdeTalla)); fl.style.setProperty('--a', pos(M.hastaTalla));
    anim(m, `subir .5s ${EASE_IN} ${s(M.desde)} both`);
    anim(fl, `deslizar .8s cubic-bezier(.5,0,.2,1.4) ${s(M.mover)} both`);
    anim(m.querySelector('.rot'), `golpe .45s cubic-bezier(.2,1.5,.4,1) ${s(M.mover + 0.7)} both`);
  }

  // ---------- Anuncio tipo pelea ----------
  if (D.anuncio) {
    const A = D.anuncio;
    const a = el('abs anuncio', `<div class="foco"></div>${A.lineas.map((l, i) => `<div class="ln" style="top:${l.y}px">${l.texto}</div>`).join('')}
      <div class="onda"></div><div class="onda"></div><div class="L">${A.letra}</div><div class="sub"><span>${A.sub}</span></div>`);
    anim(a, `fadeIn .3s ease ${s(A.desde)} both`, `fadeOut .45s ease ${s(A.hasta - 0.45)} forwards`);
    a.querySelectorAll('.ln').forEach((e, i) => anim(e, `subir .4s ease-out ${s(A.lineas[i].t)} both`));
    anim(a.querySelector('.L'), `azote .55s cubic-bezier(.3,1.2,.5,1) ${s(A.letraT)} both`);
    a.querySelectorAll('.onda').forEach((e, i) => anim(e, `expandir .7s ease-out ${s(A.letraT + 0.3 + i * 0.18)} both`));
    anim(a.querySelector('.sub'), `golpe .45s cubic-bezier(.2,1.5,.4,1) ${s(A.letraT + 0.45)} both`);
    a.style.animation += `, temblor .35s linear ${s(A.letraT + 0.3)} 1`;
  }

  // ---------- Ficha del campeón ----------
  if (D.ficha) {
    const F = D.ficha;
    const f = el('abs ficha', `<div class="tt"><img src="assets/logo.png" alt=""><div><b>${F.titulo}</b><small>${F.sub}</small></div></div>
      ${F.filas.map(r => `<div class="fl${r[2] ? ' top' : ''}"><span class="k">${r[0]}</span><span class="dots"></span><span class="v">${r[1]}</span></div>`).join('')}`);
    Object.assign(f.style, { left: F.x + 'px', top: F.y + 'px' });
    anim(f, `entrarIzq .5s ${EASE_IN} ${s(F.desde)} both`, ...(D.cierre ? [`fadeOut .3s ease ${s(D.duracionClip - 0.3)} forwards`] : []));
    f.querySelectorAll('.fl').forEach((r, i) => anim(r, `entrarDer .35s ease-out ${s(F.desde + 0.4 + i * (F.paso || 0.35))} both`));
  }

  // ---------- Portada de revista ----------
  if (D.revista) {
    const R = D.revista;
    const top = el('abs revista-top', `<div class="pre">${R.pre}</div><div class="mast">${[...R.titulo].map(c => `<span>${c}</span>`).join('')}</div><div class="ed">${R.edicion}</div>`);
    top.style.top = R.y + 'px';
    anim(top.querySelector('.pre'), `fadeIn .4s ease ${s(R.desde)} both`);
    top.querySelectorAll('.mast span').forEach((c, i) => anim(c, `caerLetra .45s cubic-bezier(.2,1.4,.4,1) ${s(R.desde + 0.15 + i * 0.09)} both`));

    seg.frases.forEach((txt, i) => {
      const f = el('f', `<span class="ok">${check}</span>${txt}`, fr);
      anim(f, `entrarIzq .5s ${EASE_IN} ${s(t0 + 1.2 + i * 0.3)} both`,
              `salirIzq .4s ease-in ${s(fin + i * 0.1)} forwards`);
    });
  });

  // ---------- Stickers divertidos (aparecen y se van rápido) ----------
  (D.stickers || []).forEach(st => {
    const k = el(`abs sticker ${st.color || ''}`, `<span class="w">${st.texto}</span>`);
    k.style.top = st.y + 'px';
    if (st.x === 'centro') { k.style.left = '0'; k.style.right = '0'; k.style.margin = '0 auto'; k.style.width = 'max-content'; }
    else k.style.left = st.x + 'px';
    k.style.setProperty('--r', (st.rot || 0) + 'deg');
    k.style.setProperty('--r0', ((st.rot || 0) - 30) + 'deg');
    anim(k, `stickerIn .45s ease-out ${s(st.desde)} both`, `stickerOut .3s ease-in ${s(st.hasta - 0.3)} forwards`);
    anim(k.firstElementChild, `tambaleo .5s ease-in-out ${s(st.desde + 0.45)} infinite`);
  });

  // ---------- Flash de cámara ----------
  (D.flashes || []).forEach(t => anim(el('abs flash'), `destello .5s ease-out ${s(t)} both`));

  // ---------- Visor de cámara ----------
  (D.visores || []).forEach(v => {
    const k = el('abs visor', `<i></i><i></i><i></i><i></i><div class="foco"></div><div class="rec">${v.texto || ''}</div>`);
    Object.assign(k.style, { left: v.x + 'px', top: v.y + 'px', width: v.w + 'px', height: v.h + 'px' });
    anim(k, `enfocar .35s ease-out ${s(v.desde)} both`, `fadeOut .3s ease ${s(v.hasta - 0.3)} forwards`);
  });

  // ---------- Trazo dibujado a mano (p. ej. una V) ----------
  (D.trazos || []).forEach(tz => {
    const k = el('abs trazo', `<svg width="${tz.ancho || 320}" viewBox="0 0 320 260"><path d="${tz.path || 'M30 30 L160 230 L290 30'}"/></svg>
      <div class="t">${tz.texto}</div>`);
    k.style.top = tz.y + 'px';
    if (tz.x === 'centro') Object.assign(k.style, { left: '0', right: '0', margin: '0 auto', width: 'max-content' });
    else k.style.left = tz.x + 'px';
    anim(k, `fadeIn .15s linear ${s(tz.desde)} both`, `fadeOut .3s ease ${s(tz.hasta - 0.3)} forwards`);
    anim(k.querySelector('path'), `dibujar .6s ease-out ${s(tz.desde)} forwards`);
    anim(k.querySelector('.t'), `golpe .45s cubic-bezier(.2,1.5,.4,1) ${s(tz.desde + 0.5)} both`);
  });

  // ---------- Lupa (el video ampliado lo pone render.js; aquí el aro y su texto) ----------
  const brillo = (x, y, t, dur = 1.4) => {
    const b = el('abs brillo', `<svg viewBox="0 0 70 70"><path d="M35 0 C38 25 45 32 70 35 C45 38 38 45 35 70 C32 45 25 38 0 35 C25 32 32 25 35 0Z" fill="#F7E3A1"/></svg>`);
    b.style.left = x + 'px'; b.style.top = y + 'px';
    anim(b, `titilar ${dur}s ease-in-out ${s(t)} infinite`);
    return b;
  };
  if (D.lupa) {
    const L = D.lupa;
    const ring = el('abs lupa');
    Object.assign(ring.style, { left: L.x - L.r - 10 + 'px', top: L.y - L.r - 10 + 'px', width: 2 * L.r + 20 + 'px', height: 2 * L.r + 20 + 'px' });
    anim(ring, `pop .45s cubic-bezier(.2,1.5,.4,1) ${s(L.desde)} both`, `fadeOut .3s ease ${s(L.hasta - 0.3)} forwards`);
    const tx = el('abs lupa-txt', L.texto);
    Object.assign(tx.style, { left: '0', right: '0', margin: '0 auto', width: 'max-content', top: L.y + L.r + 30 + 'px' });
    tx.style.transform = `translateX(${L.x - 540}px)`;
    tx.style.left = '0'; tx.style.right = '0';
    anim(tx, `fadeIn .3s ease ${s(L.desde + 0.3)} both`, `fadeOut .3s ease ${s(L.hasta - 0.3)} forwards`);
    [[-L.r * 0.95, -L.r * 0.9, 0], [L.r * 0.75, -L.r * 1.05, 0.4], [L.r * 0.95, L.r * 0.6, 0.8]].forEach(([dx, dy, d]) => {
      const b = brillo(L.x + dx - 35, L.y + dy - 35, L.desde + 0.3 + d, 1.2);
      b.style.animation += `, fadeOut .01s linear ${s(L.hasta)} forwards`;
    });
  }

  // ---------- Cierre con llamada a la acción ----------
  const T = D.duracionClip, C = D.cierre;
  if (C && C.estilo === 'servido') {
    const cs = el('abs cserv', `<div class="logo"><img src="assets/logo.png" alt=""></div><div class="plato"></div>
      <svg class="campana" viewBox="0 0 700 420"><defs><linearGradient id="met" x1="0" x2="1"><stop offset="0" stop-color="#8d8d8d"/><stop offset=".35" stop-color="#f4f4f4"/><stop offset=".6" stop-color="#c9c9c9"/><stop offset="1" stop-color="#7a7a7a"/></linearGradient></defs>
        <path d="M30 400 C 30 160, 670 160, 670 400 Z" fill="url(#met)" stroke="#555" stroke-width="6"/><rect x="10" y="392" width="680" height="24" rx="12" fill="#9a9a9a"/>
        <circle cx="350" cy="168" r="30" fill="url(#met)" stroke="#555" stroke-width="5"/></svg>
      ${[400, 520, 640].map(x => `<svg class="vapor" style="left:${x}px;width:60px" viewBox="0 0 60 160"><path d="M30 150 C 0 120, 60 100, 30 70 C 0 40, 60 20, 30 0" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="8" stroke-linecap="round"/></svg>`).join('')}
      <h2>${C.titulo}</h2><div class="lin">${C.nombre}<span>${C.precio}</span></div><p>${C.texto}</p>
      <div class="btn3">${C.boton}</div><div class="baja">↓ RESPONDE ESTA HISTORIA ↓</div>`);
    anim(cs, `fadeIn .4s ease ${s(T - 0.1)} both`);
    const q4 = x => cs.querySelector(x);
    anim(q4('.plato'), `subir .4s ease-out ${s(T)} both`);
    anim(q4('.campana'), `subir .4s ease-out ${s(T)} both`, `levantar .8s cubic-bezier(.5,0,.3,1) ${s(T + 0.7)} forwards`);
    cs.querySelectorAll('.vapor').forEach((v, i) => anim(v, `vaporear 1.4s ease-out ${s(T + 1.0 + i * 0.25)} infinite`));
    anim(q4('.logo'), `pop .5s cubic-bezier(.2,1.5,.4,1) ${s(T + 0.95)} both`);
    anim(q4('h2'), `golpe .45s cubic-bezier(.2,1.5,.4,1) ${s(T + 1.2)} both`);
    anim(q4('.lin'), `subir .4s ease-out ${s(T + 1.45)} both`);
    anim(q4('p'), `fadeIn .4s ease ${s(T + 1.65)} both`);
    anim(q4('.btn3'), `pop .45s ${EASE_POP} ${s(T + 1.9)} both`, `latido .9s ease-in-out ${s(T + 2.4)} infinite`);
    anim(q4('.baja'), `fadeIn .3s ease ${s(T + 2.2)} both`, `rebote .7s ease-in-out ${s(T + 2.2)} infinite`);
  } else if (C && C.estilo === 'playa') {
    const ola = (y, col, amp) => `<svg class="mar" style="top:${y}px" viewBox="0 0 2160 400" preserveAspectRatio="none" height="400">
      <path d="M0 ${amp} ${Array.from({ length: 8 }, (_, i) => `Q ${135 + i * 270} 0 ${270 + i * 270} ${amp}`).join(' ')} V400 H0Z" fill="${col}"/></svg>`;
    const cp = el('abs cplaya', `<div class="solx"></div><img class="logo" src="assets/logo.png" alt="">
      ${ola(640, '#4FC3F7', 60)}${ola(700, '#29B6F6', 70)}${ola(780, '#0288D1', 60)}
      <h2>${C.titulo}</h2>
      <svg class="botella" viewBox="0 0 300 140"><rect x="0" y="35" width="210" height="70" rx="35" fill="rgba(170,230,210,.75)" stroke="#fff" stroke-width="6"/>
        <rect x="200" y="50" width="60" height="40" rx="8" fill="rgba(170,230,210,.8)" stroke="#fff" stroke-width="6"/><rect x="255" y="55" width="36" height="30" rx="6" fill="#B07A43"/>
        <rect x="40" y="52" width="140" height="36" rx="6" fill="#FFF6DE"/></svg>
      <div class="papel"><div class="in"><div class="ttl">${C.nota}</div>${C.items.map(i => `<div class="it${i.total ? ' tot' : ''}"><span>${i.nombre}</span><b>${i.precio}</b></div>`).join('')}
        <div class="ms">${C.texto}</div></div></div>
      <div class="btn2">${C.boton}</div><div class="baja">↓ DEJA TU MENSAJE AQUÍ ABAJO ↓</div>`);
    anim(cp, `fadeIn .5s ease ${s(T - 0.1)} both`);
    cp.querySelectorAll('.mar').forEach((m, i) => anim(m, `olas ${2.2 + i * 0.7}s linear ${s(T)} infinite`));
    const q3 = x => cp.querySelector(x);
    anim(q3('.solx'), `salir 1s cubic-bezier(.2,.9,.3,1) ${s(T)} both`);
    anim(q3('.logo'), `pop .45s ${EASE_POP} ${s(T + 0.2)} both`);
    anim(q3('h2'), `golpe .5s cubic-bezier(.2,1.5,.4,1) ${s(T + 0.3)} both`);
    anim(q3('.botella'), `entrarIzq .6s ease-out ${s(T + 0.4)} both`, `flotar2 1.6s ease-in-out ${s(T + 1)} infinite`);
    const pa = q3('.papel'); pa.style.setProperty('--h', C.altoPapel + 'px');
    anim(pa, `desenrollar .9s ease-out ${s(T + 0.9)} both`);
    anim(q3('.btn2'), `pop .45s ${EASE_POP} ${s(T + 1.8)} both`, `latido .9s ease-in-out ${s(T + 2.3)} infinite`);
    anim(q3('.baja'), `fadeIn .3s ease ${s(T + 2.1)} both`, `rebote .7s ease-in-out ${s(T + 2.1)} infinite`);
  } else if (C && C.estilo === 'musica') {
    const m = el('abs cmus', `<div class="vin"><div class="disco"></div><div class="tapa"><img src="assets/logo.png" alt=""></div></div>
      <div class="lbl">${C.etiqueta}</div><h2>${C.titulo}</h2>
      <div class="tracks">${C.temas.map((t, i) => `<div class="tr${t.total ? ' tot' : ''}"><span class="n">${t.total ? '' : i + 1}</span><span class="x">${t.nombre}</span><span class="p">${t.precio}</span></div>`).join('')}</div>
      <p>${C.texto}</p><div class="btn"><b>＋</b>${C.boton}</div><div class="baja">↓ RESPONDE ESTA HISTORIA ↓</div>`);
    anim(m, `fadeIn .45s ease ${s(T - 0.1)} both`);
    const q2 = x => m.querySelector(x);
    anim(q2('.vin'), `pop .6s cubic-bezier(.2,1.4,.4,1) ${s(T)} both`);
    anim(q2('.disco'), `girar 2.4s linear ${s(T)} infinite`);
    anim(q2('.lbl'), `fadeIn .3s ease ${s(T + 0.3)} both`);
    anim(q2('h2'), `subir .45s ease-out ${s(T + 0.35)} both`);
    m.querySelectorAll('.tr').forEach((r, i) => anim(r, `entrarDer .35s ease-out ${s(T + 0.6 + i * 0.15)} both`));
    anim(q2('p'), `fadeIn .4s ease ${s(T + 1.1)} both`);
    anim(q2('.btn'), `pop .45s cubic-bezier(.2,1.6,.4,1) ${s(T + 1.3)} both`);
    anim(q2('.baja'), `fadeIn .3s ease ${s(T + 1.6)} both`, `rebote .7s ease-in-out ${s(T + 1.6)} infinite`);
  } else if (C) {
  if (C.tinte) {
    const ti = el('abs tinte'); ti.style.background = C.tinte;
    anim(ti, `fadeIn .5s ease ${s(T - 0.1)} both`);
  }
  if (C.llamas) {
    const llama = `<svg viewBox="0 0 100 140"><path d="M50 0 C60 30 95 50 92 92 C90 122 70 140 50 140 C30 140 8 122 8 92 C8 62 32 52 34 26 C44 40 46 50 50 58 C54 40 56 20 50 0Z" fill="#FF5A1F"/>
      <path d="M50 52 C58 72 76 84 74 106 C72 126 62 136 50 136 C38 136 26 126 26 106 C26 88 42 80 44 64 C48 76 50 82 50 52Z" fill="#FFC21A"/></svg>`;
    [-40, 150, 340, 560, 760, 940].forEach((x, i) => {
      const f = el('abs llama', llama);
      Object.assign(f.style, { left: x + 'px', top: (1700 + (i % 2) * 40) + 'px', width: (i % 2 ? 160 : 200) + 'px' });
      anim(f, `subir .5s ease-out ${s(T + 0.1 + i * 0.06)} both`, `flamear ${0.5 + (i % 3) * 0.12}s ease-in-out ${s(T + 0.6)} infinite`);
    });
  }
  if (C.brillos) {
    [[120, 260], [880, 300], [80, 1150], [930, 1050], [200, 1700], [840, 1720], [500, 180]].forEach(([x, y], i) => brillo(x, y, T + 0.3 + i * 0.17, 1.3));
  }
  if (C.hojas) {
    const hoja = c => `<svg viewBox="0 0 200 260"><g class="m">
      <path d="M20 250 C 30 160, 60 80, 180 10 C 170 110, 120 200, 20 250 Z" fill="${c}"/>
      <path d="M20 250 C 70 170, 120 90, 178 14" stroke="rgba(255,255,255,.55)" stroke-width="5" fill="none"/>
      ${[0.25, 0.42, 0.58, 0.74].map(f => { const x = 20 + 158 * f, y = 250 - 236 * f;
        return `<path d="M${x} ${y} l ${-30 + f * 10} ${-12 - f * 10}" stroke="rgba(255,255,255,.4)" stroke-width="3"/>`; }).join('')}
    </g></svg>`;
    [
      { l: -120, t: 60, rot: 160, c: '#0E9F4F', dx: '-200px', dy: '-200px' },
      { l: 760, t: -40, rot: 250, c: '#16C172', dx: '200px', dy: '-200px' },
      { l: -150, t: 1400, rot: 70, c: '#16C172', dx: '-200px', dy: '200px' },
      { l: 800, t: 1420, rot: -20, c: '#0E9F4F', dx: '200px', dy: '200px' },
    ].forEach((h, i) => {
      const e = el('abs hoja', hoja(h.c));
      e.style.left = h.l + 'px'; e.style.top = h.t + 'px';
      e.style.setProperty('--rot', h.rot + 'deg'); e.style.setProperty('--dx', h.dx); e.style.setProperty('--dy', h.dy);
      anim(e, `hojaIn .6s cubic-bezier(.2,1.3,.4,1) ${s(T + 0.05 + i * 0.08)} both`);
      anim(e.querySelector('.m'), `mecer 1.8s ease-in-out ${s(T + 0.6)} infinite`);
    });
  }
  const cta = el('abs cta', `
    <div class="logo-big"><img src="assets/logo.png" alt=""></div>
    <h2 style="font-size:${Math.min(132, Math.round(940 / (C.titulo.length * 0.48)))}px">${C.titulo}</h2>
    <div class="linea"><span>${C.nombre}</span><span class="p">${C.precio}</span></div>
    ${C.detalle ? `<div class="detalle">${C.detalle}</div>` : ''}
    <p>${C.texto}</p>
    <div class="boton">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#0b1223" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      <span>${C.boton}</span>
    </div>
    <svg class="flecha" viewBox="0 0 120 120"><path d="M60 10v86M22 62l38 38 38-38" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="flecha-txt">RESPONDE ESTA HISTORIA</div>`);
  anim(cta, `fadeIn .4s ease ${s(T - 0.05)} both`);
  const q = sel => cta.querySelector(sel);
  anim(q('.logo-big'), `pop .6s cubic-bezier(.2,1.6,.4,1) ${s(T + 0.05)} both`);
  anim(q('h2'), `golpe .5s cubic-bezier(.2,1.5,.4,1) ${s(T + 0.3)} both`);
  anim(q('.linea'), `subir .5s ease-out ${s(T + 0.55)} both`);
  if (q('.detalle')) anim(q('.detalle'), `subir .5s ease-out ${s(T + 0.7)} both`);
  anim(q('p'), `subir .5s ease-out ${s(T + 0.8)} both`);
  anim(q('.boton'), `pop .5s cubic-bezier(.2,1.6,.4,1) ${s(T + 1.0)} both`, `latido .9s ease-in-out ${s(T + 1.5)} infinite`);
  anim(q('.flecha'), `fadeIn .3s ease ${s(T + 1.3)} both`, `rebote .7s ease-in-out ${s(T + 1.3)} infinite`);
  anim(q('.flecha-txt'), `fadeIn .3s ease ${s(T + 1.3)} both`);
  }
</script>
</body>
</html>
