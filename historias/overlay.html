<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historia Ropa New.Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Poppins:wght@400;600;700;800;900&family=Noto+Color+Emoji&family=Pacifico&family=Caveat:wght@600;700&family=Rubik+Spray+Paint&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #132041;
    --navy2: #0b1223;
    --amarillo: #FFD23F;
    --rosa: #FF4F8B;
    --verde: #2FD6A1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body { font-family: 'Poppins', 'Noto Color Emoji', sans-serif; color: #fff; position: relative; }
  .abs { position: absolute; }

  .grad { left: 0; width: 1080px; height: 520px; opacity: 0; }
  .grad.abajo { bottom: 0; background: linear-gradient(to top, rgba(5,8,20,.6) 15%, rgba(5,8,20,0)); }
  .grad.arriba { top: 0; background: linear-gradient(to bottom, rgba(5,8,20,.55) 15%, rgba(5,8,20,0)); }

  /* Frases cortas */
  .frases { left: 60px; display: flex; flex-direction: column; gap: 10px; }
  .f { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 26px;
    background: rgba(255,255,255,.96); color: var(--navy2); padding: 8px 22px 8px 10px;
    border-radius: 999px; width: max-content; box-shadow: 0 8px 24px rgba(0,0,0,.3); opacity: 0; }
  .f .ok { width: 34px; height: 34px; border-radius: 50%; background: var(--verde); display: grid; place-items: center; }

  /* Tarjeta producto */
  .card { left: 60px; width: 960px; height: 180px; border-radius: 32px; background: var(--navy);
    border: 5px solid #fff; box-shadow: 0 20px 60px rgba(0,0,0,.5); opacity: 0; }
  .card .tag { position: absolute; left: 40px; top: -26px; background: var(--rosa); font-weight: 800;
    font-size: 20px; letter-spacing: 1px; padding: 5px 18px; border-radius: 999px; border: 4px solid #fff; }
  .card .tag { color: var(--tagTexto, #fff); white-space: nowrap; transform-origin: 50% 100%; }
  .card .tag.ciclo { opacity: 0; }
  .sticker { font-family: 'Anton', sans-serif; font-size: 46px; letter-spacing: 1px; padding: 10px 28px;
    border-radius: 18px; border: 5px solid #fff; color: var(--navy2); background: var(--amarillo);
    box-shadow: 0 12px 30px rgba(0,0,0,.4); white-space: nowrap; opacity: 0; }
  .sticker.rosa { background: var(--rosa); color: #fff; }
  .sticker.grande { font-size: 92px; padding: 14px 44px; border-radius: 28px; border-width: 7px; }
  .sticker.oro { background: linear-gradient(135deg, #F7E3A1, #D4AF37 55%, #A8801F); color: #111; }
  .sticker.negro { background: #111; color: #F2D27A; border-color: #D4AF37; }
  .lupa { border-radius: 50%; border: 10px solid #D4AF37; box-shadow: 0 0 0 4px #fff, 0 20px 50px rgba(0,0,0,.55); opacity: 0; }
  .lupa-txt { font-family: 'Anton', sans-serif; font-size: 40px; letter-spacing: 2px; background: #111; color: #F2D27A;
    border: 4px solid #D4AF37; padding: 6px 24px; border-radius: 999px; white-space: nowrap; opacity: 0; }
  .brillo { width: 70px; height: 70px; opacity: 0; }
  .sticker.fuego { background: linear-gradient(135deg, #FFD34D, #FF7A00 50%, #FF2E1F); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .trazo { opacity: 0; text-align: center; }
  .trazo svg path { fill: none; stroke: #FFB800; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1000; stroke-dashoffset: 1000; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  .trazo .t { font-family: 'Anton', sans-serif; font-size: 60px; color: #fff; text-shadow: 0 6px 20px rgba(0,0,0,.7); margin-top: -10px; white-space: nowrap; }
  .trazo .t b { color: #FFB800; font-weight: 400; }
  .llama { width: 180px; opacity: 0; transform-origin: 50% 100%; }
  .sticker.lima { background: #D7FF3A; color: #111; border-color: #111; }
  .sticker.negro2 { background: #111; color: #fff; }
  .flash { left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; opacity: 0; }
  .visor { opacity: 0; }
  .visor i { position: absolute; width: 90px; height: 90px; border: 0 solid var(--amarillo); filter: drop-shadow(0 0 3px #111) drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
  .visor i:nth-child(1) { left: 0; top: 0; border-top-width: 10px; border-left-width: 10px; }
  .visor i:nth-child(2) { right: 0; top: 0; border-top-width: 10px; border-right-width: 10px; }
  .visor i:nth-child(3) { left: 0; bottom: 0; border-bottom-width: 10px; border-left-width: 10px; }
  .visor i:nth-child(4) { right: 0; bottom: 0; border-bottom-width: 10px; border-right-width: 10px; }
  .visor .foco { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px; }
  .visor .foco::before, .visor .foco::after { content: ''; position: absolute; background: var(--amarillo); box-shadow: 0 0 3px #111; }
  .visor .foco::before { left: 27px; top: 0; width: 6px; height: 60px; }
  .visor .foco::after { top: 27px; left: 0; height: 6px; width: 60px; }
  .visor .rec { position: absolute; left: 10px; top: -70px; font-weight: 800; font-size: 32px; letter-spacing: 2px;
    background: #111; padding: 6px 20px; border-radius: 999px;
    display: flex; align-items: center; gap: 12px; text-shadow: 0 2px 8px rgba(0,0,0,.7); white-space: nowrap; }
  .visor .rec::before { content: ''; width: 22px; height: 22px; border-radius: 50%; background: #FF2E2E; animation: inherit; }

    box-shadow: 0 20px 50px rgba(0,0,0,.5);

                  radial-gradient(circle 26px at 100% 62%, #0000 97%, #000) right / 51% 100% no-repeat; }
  .pase .head { position: absolute; left: 0; right: 0; top: 0; height: 56px; border-bottom: 3px dashed rgba(231,195,90,.7);
    display: flex; align-items: center; justify-content: space-between; padding: 0 34px; }
  .pase .head .tg { position: relative; height: 56px; flex: 1; }
  .pase .head .tg span { position: absolute; left: 0; top: 12px; font-weight: 800; font-size: 24px; letter-spacing: 2px;
    color: #E7C35A; white-space: nowrap; transform-origin: 50% 100%; }
  .pase .head .nro { font-family: 'Courier New', monospace; font-weight: 700; font-size: 26px; color: #F4E3A8; letter-spacing: 3px; }
  .pase .logo { position: absolute; left: 30px; top: 82px; width: 140px; border-radius: 16px; border: 3px solid #E7C35A; }
  .pase .tit { position: absolute; left: 196px; top: 74px; font-weight: 800; font-size: 22px; letter-spacing: 6px; color: #E7C35A; }
  .pase .nombre { position: absolute; left: 194px; top: 104px; font-family: 'Anton', sans-serif; font-size: 66px; line-height: 1; color: #fff; white-space: nowrap; }
  .pase .nombre b { color: #F4E3A8; font-weight: 400; }
  .pase .chips { position: absolute; left: 196px; top: 186px; display: flex; gap: 14px; }
  .pase .chip { font-weight: 800; font-size: 21px; padding: 4px 16px; border-radius: 999px; background: #F4E3A8; color: #0B3F27; }
  .sello { width: 250px; height: 250px; border-radius: 50%; border: 9px double #D7263D; color: #D7263D; opacity: 0;
    display: grid; place-items: center; text-align: center; background: rgba(255,250,235,.88);
    box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .sello small { display: block; font-weight: 900; font-size: 26px; letter-spacing: 4px; }
  .sello strong { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 66px; line-height: 1; }
  /* Golf */
  .hoyo { width: 110px; height: 30px; border-radius: 50%; background: radial-gradient(#000 55%, #1d1d1d); box-shadow: 0 0 0 6px #2E9E4F; opacity: 0; }
  .bandera { width: 140px; height: 230px; opacity: 0; transform-origin: 6px 100%; }
  .pelota { width: 54px; height: 54px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle at 35% 30%, #fff 30%, #dcdcdc 70%, #b9b9b9);
    box-shadow: 0 6px 10px rgba(0,0,0,.4); }
  .pelota::after { content: ''; position: absolute; inset: 8px; border-radius: 50%;

  .sticker.club { background: #0F5132; color: #F4E3A8; border-color: #E7C35A; }
  .sticker.crema { background: #F4E3A8; color: #0B3F27; border-color: #0F5132; }
  /* Etiqueta de precio colgante */
  .colgante { width: 340px; transform-origin: 50% 0; opacity: 0; }
  .colgante .hilo { width: 4px; height: 90px; margin: 0 auto; background: #1b1b1b; border-radius: 2px; }
  .colgante .papel { position: relative; background: linear-gradient(160deg, #22386A, #1A2B4C 60%, #121F38); color: #F6F1E6; border: 3px solid #C9A227; border-radius: 22px 22px 18px 18px;
    padding: 64px 26px 26px; text-align: center; box-shadow: 0 22px 40px rgba(0,0,0,.4);
    clip-path: polygon(22% 0, 78% 0, 100% 9%, 100% 100%, 0 100%, 0 9%); }
  .colgante .ojal { position: absolute; left: 50%; top: 18px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%;
    background: #E9E2D0; box-shadow: inset 0 0 0 6px #C9A227; }
  .colgante .logo { width: 150px; border-radius: 14px; margin: 0 auto; display: block; }
  .colgante .n1 { margin-top: 14px; font-weight: 800; font-size: 26px; letter-spacing: 6px; }
  .colgante .n2 { color: #F2D27A; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 64px; line-height: 1; font-style: italic; }
  .colgante .ch { margin-top: 10px; font-weight: 700; font-size: 22px; letter-spacing: 2px; color: #C9D3E6; }
  .colgante .pr { margin-top: 14px; font-family: 'Anton', sans-serif; font-size: 78px; line-height: 1; color: #1A2B4C;
    background: #F2D27A; border-radius: 14px; padding: 6px 0; }
  .colgante .tg { position: relative; height: 34px; margin-top: 12px; }
  .colgante .tg span { position: absolute; left: 0; right: 0; top: 4px; font-weight: 800; font-size: 15px; letter-spacing: .5px;
    color: #F2D27A; white-space: nowrap; transform-origin: 50% 100%; opacity: 0; }
  /* Definición de diccionario */
  .dicc { width: 860px; background: #FFFDF7; color: #1d1d1d; border-radius: 18px; padding: 34px 44px 30px;
    box-shadow: 0 24px 50px rgba(0,0,0,.4); border-left: 14px solid #1A2B4C; opacity: 0; }
  .dicc .pal { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 76px; line-height: 1; }
  .dicc .pal i { font-weight: 400; font-size: 40px; color: #777; margin-left: 14px; }
  .dicc .def { margin-top: 14px; font-family: 'Playfair Display', serif; font-size: 38px; line-height: 1.3; }
  .dicc .def b { font-family: 'Poppins', sans-serif; font-size: 30px; color: #9a7b1c; margin-right: 8px; }
  .dicc .def2 { margin-top: 12px; font-size: 36px; font-weight: 700; line-height: 1.3; opacity: 0; }
  .dicc .def2 b { background: #FFD23F; padding: 0 8px; }
  .sticker.papel { background: #F6F1E6; color: #1A2B4C; border-color: #1A2B4C; }
  .sticker.marino { background: #1A2B4C; color: #F6F1E6; }
  /* Chat */
  .chat { left: 60px; width: 960px; }
  .chat .cab { display: flex; align-items: center; gap: 18px; background: rgba(32,30,27,.92); border-radius: 26px;
    padding: 14px 22px; opacity: 0; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .chat .cab img { width: 84px; height: 72px; object-fit: cover; border-radius: 50%; border: 3px solid #E8D3A8; }
  .chat .cab b { display: block; font-size: 32px; font-weight: 800; }
  .chat .cab small { display: block; font-size: 22px; color: #9BE59B; font-weight: 600; }
  .chat .slot { position: relative; margin-top: 18px; display: flex; }
  .chat .slot.yo { justify-content: flex-end; }
  .chat .msg, .chat .esc { font-size: 33px; font-weight: 600; line-height: 1.3; padding: 16px 24px 14px; border-radius: 28px;
    max-width: 740px; color: #1d1d1d; box-shadow: 0 8px 20px rgba(0,0,0,.28); opacity: 0; }
  .chat .ella .msg, .chat .esc { background: #fff; border-bottom-left-radius: 8px; }
  .chat .yo .msg { background: #DCF8C6; border-bottom-right-radius: 8px; }
  .chat .msg .h { font-size: 20px; color: #7a7a7a; margin-left: 14px; font-weight: 600; }
  .chat .msg .pz { font-family: 'Anton', sans-serif; font-size: 50px; font-weight: 400; color: #1d1d1d; background: #E8D3A8;
    padding: 0 12px; border-radius: 10px; }
  .chat .esc { position: absolute; left: 0; top: 0; display: flex; gap: 10px; padding: 24px 28px; }
  .chat .esc i { width: 16px; height: 16px; border-radius: 50%; background: #9a9a9a; animation: inherit; }
  .pluma { width: 150px; opacity: 0; }
  .sticker.arena { background: #E8D3A8; color: #2B2A27; border-color: #fff; }
  .sticker.cafe { background: #2B2A27; color: #E8D3A8; }
  /* Amanecer con saludo */
  .amanecer { left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; opacity: 0;
    background: linear-gradient(180deg, rgba(255,196,120,.93) 0%, rgba(255,150,120,.9) 45%, rgba(255,112,140,.88) 100%); }
  .amanecer .sol { position: absolute; left: 50%; top: 1150px; width: 420px; height: 420px; margin-left: -210px; }
  .amanecer .sol .disco { position: absolute; inset: 90px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #FFF6C9, #FFD45C 55%, #FFB02E); box-shadow: 0 0 120px 40px rgba(255,220,120,.7); }
  .amanecer .sol svg { position: absolute; inset: 0; }
  .amanecer .hola { position: absolute; left: 0; right: 0; top: 330px; text-align: center; color: #fff;
    font-family: 'Pacifico', cursive; font-size: 112px; line-height: 1.15; text-shadow: 0 6px 24px rgba(160,60,40,.45); }
  .amanecer .sub { position: absolute; left: 90px; right: 90px; top: 680px; text-align: center; color: #5a2a1e;
    font-size: 46px; font-weight: 700; line-height: 1.3; background: rgba(255,255,255,.75); border-radius: 30px; padding: 26px 30px; }
  .amanecer .firma { position: absolute; left: 0; right: 0; top: 1640px; text-align: center; color: #fff; font-weight: 800;
    font-size: 30px; letter-spacing: 4px; }

    box-shadow: 0 24px 50px rgba(0,0,0,.4);
    background-image: linear-gradient(90deg, transparent 84px, #F28B82 84px, #F28B82 88px, transparent 88px),
                      repeating-linear-gradient(180deg, transparent 0 63px, #C9DDF2 63px 65px); background-position: 0 0, 0 50px; }
  .libreta .cinta { position: absolute; left: 50%; top: -26px; transform: translateX(-50%) rotate(-2deg); background: rgba(255,210,120,.92);
    padding: 10px 30px; font-weight: 800; font-size: 22px; letter-spacing: 2px; color: #5a3a10; white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  .libreta .logo { position: absolute; right: -40px; top: -60px; width: 150px; border-radius: 16px; transform: rotate(8deg);
    border: 4px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,.3); }
  .libreta h3 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 66px; color: #1A2B4C; line-height: 1; margin-bottom: 8px; }
  .libreta .it { display: flex; align-items: center; gap: 22px; font-family: 'Caveat', cursive; font-weight: 600; font-size: 50px; white-space: nowrap;
    color: #263238; line-height: 64px; }
  .libreta .it .box { flex: none; width: 46px; height: 46px; border: 4px solid #263238; border-radius: 8px; position: relative; }
  .libreta .it .box svg { position: absolute; left: -6px; top: -14px; width: 66px; }

    stroke-dasharray: 100; stroke-dashoffset: 100; }

  .sticker.sol { background: #FFD45C; color: #5a2a1e; }
  .sticker.durazno { background: #FF8A7A; color: #fff; }
  /* Cinta que corre (ticker) */
  .ticker { left: -20px; width: 1120px; height: 86px; overflow: hidden; background: var(--tk-bg, #0A2540);
    border-top: 5px solid var(--tk-borde, #00B4D8); border-bottom: 5px solid var(--tk-borde, #00B4D8); opacity: 0;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .ticker .pista { position: absolute; left: 0; top: 0; height: 76px; display: flex; white-space: nowrap; }
  .ticker .pista span { font-family: 'Anton', sans-serif; font-size: 46px; line-height: 76px; color: #fff; letter-spacing: 2px; padding-right: 30px; }

  .insignia .centro strong { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 52px; line-height: 1; }
  /* Máquina de escribir */

  .sticker.mar { background: #00B4D8; color: #fff; }

<script>
  // Datos del producto: los inyecta render.js (window.DATA). Este es un ejemplo para abrir el HTML directo.

    duracionClip: 8.8,
    segmentos: [{ desde: 0.4, hasta: 8.8, pos: 'abajo', nombre: 'POLERA', acento: 'PUNTO',
      chips: ['HOMBRE', 'TALLA S'], precio: '$18.000', frases: ['Tejido de punto', '100% original'] }],
    cierre: { titulo: '¿LA QUIERES?', nombre: 'POLERA PUNTO', precio: '$18.000',
      texto: 'Escríbenos por DM y te la reservamos', boton: 'RESPONDE "PUNTO"' }

  // Colores opcionales por historia (tema)
  Object.entries(D.tema || {}).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));

  const EASE_IN = 'cubic-bezier(.2,1.25,.4,1)', EASE_POP = 'cubic-bezier(.2,1.8,.4,1)';
  const el = (cls, html, parent = document.body) => {

  };
  const anim = (e, ...a) => { e.style.animation = a.join(', '); };
  const s = n => `${n.toFixed(2)}s`;

  const check = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b1223" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const pts = [];
  for (let i = 0; i < 44; i++) {
    const r = i % 2 ? 128 : 160, a = (Math.PI * i) / 22 - Math.PI / 2;
    pts.push(`${(165 + r * Math.cos(a)).toFixed(1)},${(165 + r * Math.sin(a)).toFixed(1)}`);
  }
  const estrella = `<svg viewBox="0 0 330 330" width="220" height="220">
    <polygon points="${pts.join(' ')}" style="fill:var(--sombraPrecio, var(--rosa))" transform="translate(8 8)"/>
    <polygon points="${pts.join(' ')}" style="fill:var(--amarillo)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>`;

  const ruletas = [];

  // ---------- Variante "pase de socio" con timbre de precio ----------
  function pase(seg) {
    const t0 = seg.desde, t1 = seg.hasta, top = seg.top || 1410;
    const g = el('abs grad abajo'); anim(g, `fadeIn .5s ease ${s(t0)} both`);
    const c = el('abs pase', `
      <div class="head"><div class="tg"></div><div class="nro">${seg.numero || 'Nº 0001'}</div></div>
      <img class="logo" src="assets/logo.png" alt="">
      <div class="tit">${seg.titulo || 'PASE DE SOCIO'}</div>
      <div class="nombre">${seg.nombre} <b>${seg.acento}</b></div>
      <div class="chips">${seg.chips.map(x => `<span class="chip">${x}</span>`).join('')}</div>`);
    c.style.top = top + 'px';
    anim(c, `subirCard .6s ${EASE_IN} ${s(t0)} both`);
    const tags = [].concat(seg.tag || 'TIENDA VIRTUAL 100% ORIGINAL'), paso = (t1 - t0) / tags.length;
    tags.forEach((txt, i) => {
      const sp = document.createElement('span'); sp.textContent = txt; c.querySelector('.tg').appendChild(sp);
      const a = [`tagIn .35s ease-out ${s(t0 + (i ? i * paso : 0.3))} both`];
      if (i < tags.length - 1) a.push(`tagOut .3s ease-in ${s(t0 + (i + 1) * paso - 0.3)} forwards`);
      anim(sp, ...a);
    });
    if (seg.precio) {
      const se = el('abs sello', `<div><small>${seg.selloTexto || 'APROBADO'}</small><strong>${seg.precio}</strong><small>SOLO</small></div>`);
      Object.assign(se.style, { left: '790px', top: top - 200 + 'px' });
      anim(se, `timbrazo .45s cubic-bezier(.3,1.4,.5,1) ${s(seg.selloEn ?? t0 + 0.8)} both`);
    }
  }

  if (D.colgante) {
    const K = D.colgante;
    const c = el('abs colgante', `<div class="hilo"></div><div class="papel"><div class="ojal"></div>
      <img class="logo" src="assets/logo.png" alt="">
      <div class="n1">${K.nombre}</div><div class="n2">${K.acento}</div>
      <div class="ch">${K.chips.join(' · ')}</div>
      <div class="pr">${K.precio}</div><div class="tg"></div></div>`);
    Object.assign(c.style, { left: K.x + 'px', top: K.y + 'px' });
    anim(c, `colgar 1.8s ease-out ${s(K.desde)} both`, `mecerse 2.4s ease-in-out ${s(K.desde + 1.8)} infinite`);

  // ---------- Trazo dibujado a mano (p. ej. una V) ----------
  (D.trazos || []).forEach(tz => {
    const k = el('abs trazo', `<svg width="${tz.ancho || 320}" viewBox="0 0 320 260"><path d="${tz.path || 'M30 30 L160 230 L290 30'}"/></svg>
      <div class="t">${tz.texto}</div>`);
    k.style.top = tz.y + 'px';
    if (tz.x === 'centro') Object.assign(k.style, { left: '0', right: '0', margin: '0 auto', width: 'max-content' });
    else k.style.left = tz.x + 'px';
    anim(k, `fadeIn .15s linear ${s(tz.desde)} both`, `fadeOut .3s ease ${s(tz.hasta - 0.3)} forwards`);
    anim(k.querySelector('path'), `dibujar .6s ease-out ${s(tz.desde)} forwards`);
    anim(k.querySelector('.t'), `golpe .45s cubic-bezier(.2,1.5,.4,1) ${s(tz.desde + 0.5)} both`);
  });

  // ---------- Lupa (el video ampliado lo pone render.js; aquí el aro y su texto) ----------
  const brillo = (x, y, t, dur = 1.4) => {
    const b = el('abs brillo', `<svg viewBox="0 0 70 70"><path d="M35 0 C38 25 45 32 70 35 C45 38 38 45 35 70 C32 45 25 38 0 35 C25 32 32 25 35 0Z" fill="#F7E3A1"/></svg>`);
    b.style.left = x + 'px'; b.style.top = y + 'px';
    anim(b, `titilar ${dur}s ease-in-out ${s(t)} infinite`);
    return b;
  };
  if (D.lupa) {
    const L = D.lupa;
    const ring = el('abs lupa');
    Object.assign(ring.style, { left: L.x - L.r - 10 + 'px', top: L.y - L.r - 10 + 'px', width: 2 * L.r + 20 + 'px', height: 2 * L.r + 20 + 'px' });
    anim(ring, `pop .45s cubic-bezier(.2,1.5,.4,1) ${s(L.desde)} both`, `fadeOut .3s ease ${s(L.hasta - 0.3)} forwards`);
    const tx = el('abs lupa-txt', L.texto);
    Object.assign(tx.style, { left: '0', right: '0', margin: '0 auto', width: 'max-content', top: L.y + L.r + 30 + 'px' });
    tx.style.transform = `translateX(${L.x - 540}px)`;
    tx.style.left = '0'; tx.style.right = '0';
    anim(tx, `fadeIn .3s ease ${s(L.desde + 0.3)} both`, `fadeOut .3s ease ${s(L.hasta - 0.3)} forwards`);
    [[-L.r * 0.95, -L.r * 0.9, 0], [L.r * 0.75, -L.r * 1.05, 0.4], [L.r * 0.95, L.r * 0.6, 0.8]].forEach(([dx, dy, d]) => {
      const b = brillo(L.x + dx - 35, L.y + dy - 35, L.desde + 0.3 + d, 1.2);
      b.style.animation += `, fadeOut .01s linear ${s(L.hasta)} forwards`;
    });
  }

  // ---------- Cierre con llamada a la acción ----------
  const T = D.duracionClip, C = D.cierre;
  if (C) {
  if (C.tinte) {
    const ti = el('abs tinte'); ti.style.background = C.tinte;
    anim(ti, `fadeIn .5s ease ${s(T - 0.1)} both`);
  }
  if (C.llamas) {
    const llama = `<svg viewBox="0 0 100 140"><path d="M50 0 C60 30 95 50 92 92 C90 122 70 140 50 140 C30 140 8 122 8 92 C8 62 32 52 34 26 C44 40 46 50 50 58 C54 40 56 20 50 0Z" fill="#FF5A1F"/>
      <path d="M50 52 C58 72 76 84 74 106 C72 126 62 136 50 136 C38 136 26 126 26 106 C26 88 42 80 44 64 C48 76 50 82 50 52Z" fill="#FFC21A"/></svg>`;
    [-40, 150, 340, 560, 760, 940].forEach((x, i) => {
      const f = el('abs llama', llama);
      Object.assign(f.style, { left: x + 'px', top: (1700 + (i % 2) * 40) + 'px', width: (i % 2 ? 160 : 200) + 'px' });
      anim(f, `subir .5s ease-out ${s(T + 0.1 + i * 0.06)} both`, `flamear ${0.5 + (i % 3) * 0.12}s ease-in-out ${s(T + 0.6)} infinite`);
    });
  }
  if (C.brillos) {
    [[120, 260], [880, 300], [80, 1150], [930, 1050], [200, 1700], [840, 1720], [500, 180]].forEach(([x, y], i) => brillo(x, y, T + 0.3 + i * 0.17, 1.3));
  }
  if (C.hojas) {
    const hoja = c => `<svg viewBox="0 0 200 260"><g class="m">
      <path d="M20 250 C 30 160, 60 80, 180 10 C 170 110, 120 200, 20 250 Z" fill="${c}"/>
      <path d="M20 250 C 70 170, 120 90, 178 14" stroke="rgba(255,255,255,.55)" stroke-width="5" fill="none"/>
      ${[0.25, 0.42, 0.58, 0.74].map(f => { const x = 20 + 158 * f, y = 250 - 236 * f;
        return `<path d="M${x} ${y} l ${-30 + f * 10} ${-12 - f * 10}" stroke="rgba(255,255,255,.4)" stroke-width="3"/>`; }).join('')}
    </g></svg>`;
    [
      { l: -120, t: 60, rot: 160, c: '#0E9F4F', dx: '-200px', dy: '-200px' },
      { l: 760, t: -40, rot: 250, c: '#16C172', dx: '200px', dy: '-200px' },
      { l: -150, t: 1400, rot: 70, c: '#16C172', dx: '-200px', dy: '200px' },
      { l: 800, t: 1420, rot: -20, c: '#0E9F4F', dx: '200px', dy: '200px' },
    ].forEach((h, i) => {
      const e = el('abs hoja', hoja(h.c));
      e.style.left = h.l + 'px'; e.style.top = h.t + 'px';
      e.style.setProperty('--rot', h.rot + 'deg'); e.style.setProperty('--dx', h.dx); e.style.setProperty('--dy', h.dy);
      anim(e, `hojaIn .6s cubic-bezier(.2,1.3,.4,1) ${s(T + 0.05 + i * 0.08)} both`);
      anim(e.querySelector('.m'), `mecer 1.8s ease-in-out ${s(T + 0.6)} infinite`);
    });
  }
  const cta = el('abs cta', `
    <div class="logo-big"><img src="assets/logo.png" alt=""></div>
    <h2 style="font-size:${Math.min(132, Math.round(940 / (C.titulo.length * 0.48)))}px">${C.titulo}</h2>
    <div class="linea"><span>${C.nombre}</span><span class="p">${C.precio}</span></div>
    ${C.detalle ? `<div class="detalle">${C.detalle}</div>` : ''}
    <p>${C.texto}</p>
    <div class="boton">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#0b1223" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      <span>${C.boton}</span>
    </div>
    <svg class="flecha" viewBox="0 0 120 120"><path d="M60 10v86M22 62l38 38 38-38" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="flecha-txt">RESPONDE ESTA HISTORIA</div>`);
  anim(cta, `fadeIn .4s ease ${s(T - 0.05)} both`);
  const q = sel => cta.querySelector(sel);
  anim(q('.logo-big'), `pop .6s cubic-bezier(.2,1.6,.4,1) ${s(T + 0.05)} both`);
  anim(q('h2'), `golpe .5s cubic-bezier(.2,1.5,.4,1) ${s(T + 0.3)} both`);
  anim(q('.linea'), `subir .5s ease-out ${s(T + 0.55)} both`);
  if (q('.detalle')) anim(q('.detalle'), `subir .5s ease-out ${s(T + 0.7)} both`);
  anim(q('p'), `subir .5s ease-out ${s(T + 0.8)} both`);
  anim(q('.boton'), `pop .5s cubic-bezier(.2,1.6,.4,1) ${s(T + 1.0)} both`, `latido .9s ease-in-out ${s(T + 1.5)} infinite`);
  anim(q('.flecha'), `fadeIn .3s ease ${s(T + 1.3)} both`, `rebote .7s ease-in-out ${s(T + 1.3)} infinite`);
  anim(q('.flecha-txt'), `fadeIn .3s ease ${s(T + 1.3)} both`);
  }
</script>
</body>
</html>
